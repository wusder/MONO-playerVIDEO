[package]
name = "mono-player"
version = "1.0.0"
description = "Mono Player"
edition = "2021"

[lib]
name = "mono_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
